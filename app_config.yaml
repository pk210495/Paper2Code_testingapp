# Configuration for the Paper2Code Chatbot Application

# Azure OpenAI Configuration
azure_openai:
  api_key: "${AZURE_OPENAI_API_KEY}"  # Set via environment variable
  api_base: "${AZURE_OPENAI_ENDPOINT}"  # e.g., https://your-resource.openai.azure.com/
  api_version: "2024-02-15-preview"
  deployment_name: "${AZURE_OPENAI_DEPLOYMENT}"  # Your deployment name
  
# Application Settings
app:
  title: "Paper2Code Chatbot"
  description: "Upload a research paper and let AI generate the code implementation"
  max_file_size_mb: 50
  allowed_extensions: [".pdf"]
  temp_dir: "temp_uploads"
  output_dir: "outputs"
  
# Model Settings (for Azure OpenAI)
model:
  temperature: 0.7
  max_tokens: 4000
  reasoning_effort: "high"  # for o3-mini models
